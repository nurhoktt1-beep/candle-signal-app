<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candle Signal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>⚡ Candle Signal</h1>
  <span class="status">● LIVE</span>
</header>

<main>

  <div class="selectors">

    <div class="selector">
      <label>Market</label>
      <select id="market">
        <option>USD/CHF</option>
        <option>USD/MXN</option>
        <option>EUR/USD</option>
        <option>GBP/USD</option>
        <option>USD/JPY</option>
        <option>AUD/USD</option>
        <option>NZD/USD</option>
        <option>USD/CAD</option>
      </select>
    </div>

    <div class="selector">
      <label>Timeframe</label>
      <select id="timeframe">
        <option value="1">1M</option>
        <option value="5">5M</option>
        <option value="15">15M</option>
        <option value="30">30M</option>
        <option value="60">1H</option>
        <option value="240">4H</option>
        <option value="D">1D</option>
      </select>
    </div>

  </div>

  <section class="chart-box">

    <div class="chart-header">
      <span id="selectedMarket">USD/CHF</span>
      <span id="selectedTimeframe">1M</span>
    </div>

    <div id="chart">
      <div class="chart-message">
        🕯️ Candlestick Chart
        <small>Live market data will appear here</small>
      </div>
    </div>

    <div class="signal-box">

      <div id="signal">WAITING</div>

      <div id="pattern">
        No pattern detected
      </div>

      <div id="earlyMatch">
        Early Match: --%
      </div>

      <div id="countdown">
        Waiting for signal...
      </div>

    </div>

  </section>

  <section class="result-box">

    <h2>Final Result</h2>

    <div id="finalMatch">
      Final Match: --%
    </div>

    <div id="confirmation">
      Waiting for candle close...
    </div>

  </section>

</main>

<script src="script.js"></script>

</body>
</html>
